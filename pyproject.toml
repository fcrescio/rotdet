[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rotdet-eval"
version = "0.1.0"
description = "Evaluation script for fcrescio/rotdet on Hugging Face document datasets."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Francesco Crescioli", email = "francesco.crescioli@lpnhe.in2p3.fr" }
]

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "datasets>=3.0.0",
    "huggingface_hub>=0.25.0",
    "safetensors>=0.4.3",
    "Pillow>=10.0.0",
    "numpy>=1.24",
    "tqdm>=4.65.0,<5.0.0",
    "opencv-python-headless>=4.8,<5",
    "paddlepaddle>=3.0.0",
    "paddleocr>=3.2,<3.3",
    "paddlex[ocr]>=3.2,<3.3",
    "aim>=3.22.0,<4.0.0",
    "matplotlib>=3.9.2,<4.0.0",
    "requests>=2.31.0",
    "pypdfium2>=4.30.0,<5.0.0",
    "mcp>=1.0.0",
]

[project.scripts]
rotdet-eval = "evaluate_rotdet:main"
rotdet-train = "train_rotdet:main"
rotdet-snapshot = "snapshot_stream:main"
paddleocr-eval = "evaluate_paddleocr:main"
paddleocr-filter = "paddleocr_prefilter:main"
rotdet-mcp = "rotdet_mcp_server:main"

[tool.setuptools]
py-modules = [
    "rotdet_model",
    "rotdet_data",
    "rotdet_hf",
    "evaluate_rotdet",
    "train_rotdet",
    "snapshot_stream",
    "evaluate_paddleocr",
    "paddleocr_prefilter",
    "rotdet_mcp_server",
]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu129" } 
paddlepaddle= { index = "paddle-cpu" } 

[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true
