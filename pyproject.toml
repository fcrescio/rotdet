[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rotdet-eval"
version = "0.1.0"
description = "Evaluation script for fcrescio/rotdet on Hugging Face document datasets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "datasets>=3.0.0",
    "huggingface_hub>=0.25.0",
    "safetensors>=0.4.3",
    "tqdm>=4.65.0",
    "Pillow>=10.0.0",
    "numpy>=1.24",
    "tqdm>=4.65.0,<5.0.0",
]

[project.scripts]
rotdet-eval = "evaluate_rotdet:main"
rotdet-train = "train_rotdet:main"
rotdet-snapshot = "scripts.snapshot_stream:main"

[tool.setuptools]
py-modules = ["rotdet_model", "rotdet_data", "rotdet_hf", "evaluate_rotdet", "train_rotdet", "snapshot_stream"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"

[tool.setuptools.packages.find]
where = ["scripts"]
