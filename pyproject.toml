[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rotdet"
version = "2.0.0"
description = "Compact C4-equivariant four-way document orientation detection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Francesco Crescioli" }
]

dependencies = [
    "torch>=2.0",
    "safetensors>=0.4.3",
    "Pillow>=10.0.0",
    "numpy>=1.24",
]

[project.scripts]
rotdet = "rotdet.predict:main"

[project.optional-dependencies]
hub = ["huggingface_hub>=0.25.0"]
test = ["pytest>=8"]
legacy = ["torchvision>=0.15", "datasets>=3.0.0", "huggingface_hub>=0.25.0", "tqdm>=4.65.0", "requests>=2.31.0"]

[tool.setuptools]
packages = ["rotdet"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
